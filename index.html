try{const d=JSON.parse(localStorage.getItem('cinevj1')||'null');if(d){Object.assign(S,d.s||{});if(Array.isArray(d.m)&&d.m.length){M.length=0;M.push(...d.m)}}else{S.tx=[];S.subs=[];S.req=[]}}catch(e){}
S.cfg=Object.assign({},DEF,S.cfg);if(S.cfg.name==='CinéVJ')S.cfg.name=DEF.name;['pay','soc','th'].forEach(k=>{S.cfg[k]=Object.assign({},DEF[k],S.cfg[k])});S.users=S.users||[];S.wl=S.wl||[];S.msgs=S.msgs||[];
[[GEN,'g'],[VJS,'v'],[YRS,'y']].forEach(a=>{const s=[...new Set(M.map(m=>m[a[1]]))];a[0].length=0;a[0].push(...s)});YRS.sort((a,b)=>b-a);
draw();
</script></body></html>
